[build-system]
requires = ["setuptools>=70.0", "wheel", "build"]
build-backend = "setuptools.build_meta"

[project]
name = "PlantOmicsGwas"
version = "0.2.13"
description = "Integrated GWAS, genomic prediction, GUI, CLI, and HPC pipeline for plant genomics."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = { text = "MIT" }

authors = [
    { name = "Ahmed Yassin", email = "ahmedyassin300@outlook.com" },
    { name = "Falak Sher Khan", email = "falak.khan@pku.edu.cn" }
]

keywords = [
    "GWAS",
    "Plant Genomics",
    "Bioinformatics",
    "Genomic Prediction",
    "Variant Calling",
    "Machine Learning",
    "HPC",
    "CLI"
]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "dearpygui>=1.11",
    "pyyaml>=6.0"
]

[project.optional-dependencies]

ml = [
    "xgboost>=2.0"
]

gwas = [
    "fastlmm; python_version < '3.12'",
    "pysnptools",
    "geneview"
]

hpc = [
    "pyyaml>=6.0"
]

all = [
    "xgboost>=2.0",
    "fastlmm; python_version < '3.12'",
    "pysnptools",
    "geneview",
    "pyyaml>=6.0"
]

[project.scripts]

plantomicsgwas = "plantvarfilter.cli:main"

plantomicsgwas-gui = "plantvarfilter.main_ui:main"

plantomicsgwas-compute = "plantvarfilter.compute.compute_cli:main"

[project.urls]

Homepage = "https://github.com/AHMEDY3DGENOME/PlantVarFilter"

Documentation = "https://github.com/AHMEDY3DGENOME/PlantVarFilter/wiki"

"Issue Tracker" = "https://github.com/AHMEDY3DGENOME/PlantVarFilter/issues"

[tool.setuptools]

include-package-data = true

[tool.setuptools.packages.find]

where = ["."]
include = ["plantvarfilter*"]

[tool.setuptools.package-data]

plantvarfilter = [
    "assets/**/*",
    "windows/*.ini"
]